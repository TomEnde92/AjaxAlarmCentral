[project]
name = "ajaxcentral"
version = "0.1.0"
description = "Zelfgehoste alarmcentrale voor Ajax Security systemen op een Raspberry Pi 5"
requires-python = ">=3.11"
dependencies = [
    "pysiaalarm>=3.2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "aiomqtt>=2.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "pycryptodome>=3.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
]

[project.scripts]
ajaxcentral = "ajaxcentral.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ajaxcentral"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001: emoji in meldteksten zijn opzettelijk, geen verdwaalde leestekens.
ignore = ["B008", "RUF001"]

[tool.mypy]
python_version = "3.11"
packages = ["ajaxcentral"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
