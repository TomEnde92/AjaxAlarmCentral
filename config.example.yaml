# Ajax Alarmcentrale — voorbeeldconfiguratie.
# Kopieer naar config.yaml en pas aan. Secrets horen NIET hier maar in .env.

# Tijdzone voor de tijdstippen in de meldingen. Het dashboard gebruikt de
# tijdzone van je browser en trekt zich hier niets van aan.
timezone: "Europe/Amsterdam"

# ─────────────────────────────────────────────────────────────────────────────
# Ontvangst van de Ajax hub (SIA DC-09)
#
# Stel in de Ajax-app in: Space-instellingen (tandwiel) → Beveiligingsbedrijven
# → Meldkamer. Protocol "SIA DC-09 (SIA-DCS)", IP = het adres van deze Pi,
# poort = de poort hieronder, objectnummer = account_id hieronder.
# ─────────────────────────────────────────────────────────────────────────────
sia:
  host: "0.0.0.0"
  port: 10000
  protocol: tcp            # tcp of udp — moet overeenkomen met de hub
  account_id: "AA01"       # "Objectnummer" in de Ajax-app, 3-16 hex-tekens
  # De encryptiesleutel staat in .env als AJAXCENTRAL_SIA_KEY.

  # Het ping-interval dat je in de Ajax-app hebt ingesteld, in seconden.
  ping_interval_seconds: 60
  # De hub geldt als offline na ping_interval × deze factor zonder enig bericht.
  # Lager = sneller alarm bij sabotage, maar meer kans op vals alarm.
  offline_factor: 2.5
  # Blijft de hub weg en is het alarm niet bevestigd in het dashboard, dan
  # wordt "Hub niet bereikbaar" na dit aantal seconden opnieuw gemeld, met een
  # nieuwe belronde. Een uitval hoort te blijven piepen tot iemand hem ziet.
  # 0 = alleen de eerste melding.
  offline_repeat_seconds: 900

  # De hub zet een tijdstip in elk bericht. Loopt die klok achter op deze Pi,
  # dan weigert de centrale het bericht zodra het verschil boven de 40 seconden
  # komt — en dan hoort ze niets meer, zonder dat er iets veranderd is. Bij dit
  # aantal seconden verschil komt er een storingsmelding, zodat je de tijd van
  # de hub kunt gelijkzetten voordat het zover is. 0 = geen bewaking.
  clock_warn_seconds: 25

# ─────────────────────────────────────────────────────────────────────────────
# Namen. Zonder deze tabel toont het dashboard "apparaat 12" in plaats van
# "Voordeur". De sleutels zijn de ID's zoals ze in het logboek verschijnen —
# start eerst zonder namen, kijk in Diagnostiek welke ID's binnenkomen, en
# vul ze daarna hier in.
# ─────────────────────────────────────────────────────────────────────────────
devices:
  "01": "Voordeur"
  "02": "Achterdeur"
  "03": "Bewegingsmelder woonkamer"
  "04": "Rookmelder overloop"

# Soort melder per apparaat. Bepaalt welke melders je bij een testalarm kunt
# kiezen: rookmelders bij een brandtest, inbraakmelders bij een inbraaktest.
# Soorten: fire, burglary, other (sirene, sleutelhanger, bedienpaneel: bij
# geen enkele test te kiezen). Apparaten die hier niet staan blijven bij elke
# test kiesbaar, met de hint "soort niet ingesteld".
device_types:
  "01": burglary
  "02": burglary
  "03": burglary
  "04": fire

partitions:
  "1": "Begane grond"
  "2": "Verdieping"

# Gebruikers. Bij in- en uitschakelen stuurt de hub geen zone maar het nummer
# van de persoon die het deed, dus hiermee wordt "Uitgeschakeld door gebruiker
# 02" gewoon "Uitgeschakeld door Lisa".
users:
  "01": "Tom"
  "02": "Lisa"

database:
  path: "data/ajaxcentral.db"
  # Events ouder dan dit worden opgeruimd. 0 = nooit opruimen.
  retention_days: 730

# ─────────────────────────────────────────────────────────────────────────────
# Web-dashboard. Gebruikersnaam hier, wachtwoord-hash en sessiesleutel in .env.
# ─────────────────────────────────────────────────────────────────────────────
web:
  host: "0.0.0.0"
  port: 8080
  username: "admin"
  # Zet op de externe URL van het dashboard, zodat links in de melding
  # aanklikbaar zijn vanaf je telefoon.
  base_url: "http://192.168.1.50:8080"

# ─────────────────────────────────────────────────────────────────────────────
# Pushover: het meldkanaal. Eén app op je telefoon en één verzoek per melding.
# Een alarm gaat als noodmelding: hard geluid dat
# door Niet Storen heen gaat, herhaald tot je in de app op Bevestigen tikt. Die
# bevestiging komt terug in het dashboard, en andersom stopt bevestigen in het
# dashboard de telefoon. Storingen komen als gewoon bericht met hoge prioriteit.
#
# De sleutels horen in .env: AJAXCENTRAL_PUSHOVER_USER (je user key) en
# AJAXCENTRAL_PUSHOVER_TOKEN (de API token van een eigen "application").
# ─────────────────────────────────────────────────────────────────────────────
pushover:
  enabled: false
  # Welke alarmcategorieën een noodmelding geven; de rest is een gewoon
  # bericht. Let op: alleen events met ernst "alarm" tellen mee; een storing in
  # een van deze categorieën niet.
  #
  # "gas" en "heat" staan hier bewust naast "fire": een Ajax FireProtect Plus
  # meldt rook als FA, koolmonoxide als GA en hitte als KA. Wie alleen "fire"
  # laat afgaan, mist twee derde van wat diezelfde melder detecteert.
  #
  # "supervision" is de zelfgemaakte melding dat de hub niet meer reageert —
  # stroomuitval of een doorgeknipte kabel. Haal die er niet uit.
  #
  # Alle categorieen: burglary, fire, gas, heat, water, panic, medical,
  # tamper, arming, power, battery, rf, communication, supervision, access,
  # test, config, system, unknown
  categories: ["burglary", "fire", "gas", "heat", "panic", "medical", "supervision"]
  sound: "siren"           # zie pushover.net/api#sounds
  retry_seconds: 30        # herhaal-interval op de telefoon (minimaal 30, eis van Pushover)
  expire_seconds: 10800    # hoe lang Pushover één noodmelding herhaalt (maximaal 10800);
                           # daarna stuurt de centrale een nieuwe, tot iemand bevestigt
  # device: "telefoon"     # leeg = alle toestellen van je account

# ─────────────────────────────────────────────────────────────────────────────
# In- en uitschakelen. Ajax stuurt voor de "nachtmodus" (alleen de melders van
# de nachtgroep, bijvoorbeeld de begane grond) altijd code NL — ook als je die
# overdag gebruikt. Binnen het nachtvenster meldt de centrale dat als
# "Nachtinschakeling", daarbuiten als "Deelinschakeling". Tijden in de
# tijdzone hierboven; het venster mag over middernacht lopen.
# ─────────────────────────────────────────────────────────────────────────────
arming:
  night_start: "21:00"
  night_end: "07:00"
  # night_title: "Nachtinschakeling"
  # partial_title: "Deelinschakeling"

# ─────────────────────────────────────────────────────────────────────────────
# Filters voor tekstmeldingen. Let op: deze filters raken NOOIT severity
# "alarm" — een inbraak- of brandmelding wordt nooit onderdrukt.
# ─────────────────────────────────────────────────────────────────────────────
notifications:
  min_severity: "trouble"        # info, heartbeat, restore, trouble, alarm, unknown
  dedupe_window_seconds: 30      # identiek event binnen dit venster = één melding

  quiet_hours:
    enabled: false
    start: "23:00"
    end: "07:00"
    # Wat er tijdens stille uren nog doorkomt. "alarm" staat er altijd bij,
    # ook als je hem hier weghaalt.
    allow_severities: ["alarm"]

# ─────────────────────────────────────────────────────────────────────────────
# Zelftest. Belt op een vast moment om te bewijzen dat de hele keten tot je
# telefoon werkt. Als de testring niet binnen ack_deadline_minutes bevestigd
# is, zet het dashboard een waarschuwing.
# ─────────────────────────────────────────────────────────────────────────────
selftest:
  enabled: true
  weekday: 1                 # 0 = maandag ... 6 = zondag
  hour: 14
  minute: 0
  ack_deadline_minutes: 30

# ─────────────────────────────────────────────────────────────────────────────
# MQTT / Home Assistant
# ─────────────────────────────────────────────────────────────────────────────
mqtt:
  enabled: false
  host: "192.168.1.10"
  port: 1883
  base_topic: "ajaxcentral"
  # Publiceert HA MQTT Discovery configs, zodat alles vanzelf in Home Assistant
  # verschijnt zonder handmatige YAML.
  discovery: true
  discovery_prefix: "homeassistant"
